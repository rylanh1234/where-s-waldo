<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where's Waldo</title>
</head>
<body>
    <div id="photoDiv"></div>
    <div id="timerDiv">00:00</div>
    <div id="wrongMessageDiv"></div>

    <script>
        async function loadPhoto(photoId) {
            const res = await fetch(`/api/${photoId}`);
            const photo = await res.json();

            document.body.style.display = "flex";
            const photoDiv = document.getElementById("photoDiv");
            const photoImg = document.createElement("img");
            photoDiv.style.width = '85vw';
            photoDiv.style.height = '85vh';
            photoImg.src = photo.imageUrl;
            photoImg.style.width = '100%';
            photoImg.style.height = '100%';
            photoDiv.appendChild(photoImg);

            photoDiv.addEventListener("click", (e) => {
                clickDropdown(e, photoDiv, photo.coordinates);
            });
        }

        async function selectPhoto() {
            const photoId = 1;
            return photoId;
        }

        function clickDropdown(e, photoDiv, coordinatesArray) {
            const dropdownDiv = document.createElement("div");
            // if dropdown already exists, remove it and make new one
            if (photoDiv.querySelector("#dropdownDiv")) {
                photoDiv.lastChild.remove();
            }

            // calculate the coordinates of user click (in px)
            const rect = photoDiv.getBoundingClientRect();
            const xcoordpx = e.clientX - rect.left;
            const ycoordpx = e.clientY - rect.top;
            // convert to vw and vh units
            const xcoord = (xcoordpx / window.innerWidth) * 100;
            const ycoord = (ycoordpx / window.innerHeight) * 100;

            photoDiv.style.position = "relative";
            photoDiv.appendChild(dropdownDiv);
            dropdownDiv.setAttribute("id", "dropdownDiv");
            dropdownDiv.style.position = "absolute";
            dropdownDiv.style.left = xcoord.toString() + "vw";
            dropdownDiv.style.top = ycoord.toString() + "vh";
            dropdownDiv.style.backgroundColor = "rgb(240, 240, 240, 0.85)";
            dropdownDiv.style.width = "5vw";
            dropdownDiv.style.height = "10vh";

            coordinatesArray.map((coordinate) => {
                const targetDiv = document.createElement("div");
                targetDiv.setAttribute("id", coordinate.name)
                targetDiv.textContent = coordinate.name;
                targetDiv.style.border = "black 1px solid";
                if (coordinate.found) {
                    targetDiv.style.textDecoration = "line-through";
                }
                else {
                    targetDiv.addEventListener("click", () => {
                    const isHit = targetHit([xcoord, ycoord], [coordinate.xpos, coordinate.ypos]);
                    addMarker(photoDiv, dropdownDiv, isHit, [xcoord, ycoord]);
                    if (isHit) {
                        coordinate.found = true;
                    }
                    else {
                        wrongMessage(coordinate.name);
                    }
                    });
                }
                dropdownDiv.appendChild(targetDiv);
            })
            dropdownDiv.style.display = "grid";
            dropdownDiv.style.border = "black 1px solid";
        }

        function addClearDropdown() {
            const excluded = document.getElementById("photoDiv");
            const photoDiv = document.getElementById("photoDiv");
            // remove dropdown when user clicks away from photo
            document.addEventListener("click", (e) => {
                if (!excluded.contains(e.target) && photoDiv.querySelector("#dropdownDiv")) {
                    photoDiv.lastChild.remove();
                }
            })
        }

        function targetHit(userCoordinates, targetCoordinates) {
            const xLower = targetCoordinates[0][0];
            const xUpper = targetCoordinates[0][1];
            const yLower = targetCoordinates[1][0];
            const yUpper = targetCoordinates[1][1];
            if (userCoordinates[0] > xLower && userCoordinates[0] < xUpper
            && userCoordinates[1] > yLower && userCoordinates[1] < yUpper) {
                return true;
            }
            else {
                return false;
            }
        }

        function addMarker(photoDiv, dropdownDiv, isHit, userCoordinates) {
            const markerDiv = document.createElement("div");
            if (isHit) {
                // hollow red circle marker for hits
                markerDiv.style.width = "2vw";
                markerDiv.style.height = "3vh";
                markerDiv.style.border = "4px solid red";
                markerDiv.style.borderRadius = "50%";
                markerDiv.style.background = "transparent";
            }
            else {
                // red X that fades away for misses
                markerDiv.style.fontSize = "2em";
                markerDiv.style.fontWeight = "bold";
                markerDiv.style.color = "red"; 
                markerDiv.textContent = "✕";
                markerDiv.style.opacity = "1";
                markerDiv.style.transition = "opacity 1s ease";
                // fade after 5s with 1s duration and then remove once in case of other transitions
                setTimeout(() => {
                    markerDiv.style.opacity = "0";
                    markerDiv.addEventListener("transitionend", () => {
                        markerDiv.remove();
                    }, { once: true });
                }, 5000);
            }
            markerDiv.style.position = "absolute";
            markerDiv.className = "markerDiv";
            // shift marker left 1vw and up 1.5 vh
            markerDiv.style.left = (userCoordinates[0] - 1).toString() + "vw";
            markerDiv.style.top = (userCoordinates[1] - 1.5).toString() + "vh";
            photoDiv.insertBefore(markerDiv, dropdownDiv); // insertBefore() so marker is not last child which is removed
        }

        function wrongMessage(targetName) {
            const wrongMessageDiv = document.getElementById("wrongMessageDiv");
            const wrongMessage = document.createElement("div");
            wrongMessage.textContent = targetName + " is not there!";
            wrongMessageDiv.appendChild(wrongMessage);
            // after 5 seconds, remove the message
            setTimeout(() => {
                wrongMessage.remove();
            }, 5000);
        }

        function loadTimer() {
            const timerDiv = document.getElementById("timerDiv");
            let elapsedTime = 0;
            setInterval((time) => {
                elapsedTime ++;
                timerDiv.textContent = formatTime(elapsedTime);
            }, 1000);
        }

        function formatTime(secs) {
            // convert seconds to MM:SS format
            const mm = Math.floor(secs / 60);
            const ss = secs % 60;
            // pads start with "0" unless its already 2 digits
            return String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
        }

        async function main() {
            const photoId = await selectPhoto();
            await loadPhoto(photoId);
            loadTimer();
            addClearDropdown();
        }
        
        main();
    </script>
</body>
</html>
